<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Überraschung</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1);overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:#ffffffcc;padding:40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0004;animation:pop .5s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-size:2.8em}.btn{padding:14px 28px;font-size:1.2em;border:none;border-radius:999px;cursor:pointer;margin:10px}
#yes{background:#4caf50;color:#fff}#no{background:#e53935;color:#fff;position:fixed}
.heart{position:fixed;color:#fff;font-size:24px;animation:float 8s linear infinite}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}
.final{font-size:4em;color:#fff;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
</style></head><body>
<div class="card" id="card"><h1 id="q">Kommst du heute? 😊</h1><button class="btn" id="yes">Ja ❤️</button><button class="btn" id="no">Nein 😅</button></div>
<script>
const no=document.getElementById('no'),yes=document.getElementById('yes'),q=document.getElementById('q'),card=document.getElementById('card');let step=1;
function move(){let x=Math.random()*(innerWidth-no.offsetWidth-20),y=Math.random()*(innerHeight-no.offsetHeight-20);no.style.left=x+'px';no.style.top=y+'px';}
['mouseenter','mousemove','touchstart'].forEach(e=>no.addEventListener(e,move));
move();
for(let i=0;i<20;i++){let h=document.createElement('div');h.className='heart';h.textContent='❤';h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*8+'s';document.body.appendChild(h);}
yes.onclick=()=>{
 if(step==1){step=2;card.style.opacity=0;setTimeout(()=>{card.style.opacity=1;q.innerHTML='🥰 Das freut mich!<br>17:00 Uhr?';yes.textContent='Natürlich ❤️';move();},300);}
 else{
 document.body.innerHTML='<div style="display:flex;justify-content:center;align-items:center;flex-direction:column;height:100vh;width:100%"><div class="final">🎉 Perfekt! 🎉</div><h2 style="color:white">Dann bis 17:00 Uhr ❤️</h2></div>';
 }
};
</script></body></html>
