<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baby ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}


body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#ffc1d9,
#ffd9e8,
#c9d8ff,
#e8c8ff
);

background-size:400% 400%;

animation:bg 15s ease infinite;

}


@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}



.container{

width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

position:relative;

}




/* TITEL */


.title{

position:absolute;

top:70px;

color:white;

font-size:2.4rem;

text-shadow:
0 5px 20px rgba(0,0,0,.15);

}



/* ------------------
   UMSCHLAG
------------------ */


.envelope{

width:360px;

height:240px;

position:absolute;

cursor:pointer;

transition:
opacity 1s ease,
transform 1s ease;

}


.envelope.hide{

opacity:0;

transform:
scale(.5)
translateY(-100px);

pointer-events:none;

}



.back{

position:absolute;

inset:0;

background:#f5a6c8;

border-radius:15px;

box-shadow:
0 25px 50px rgba(0,0,0,.2);

}



.letter-preview{

position:absolute;

left:20px;

right:20px;

bottom:15px;

height:170px;

background:white;

border-radius:12px;

padding:20px;

z-index:2;

}



.letter-preview h2{

color:#ff5c9a;

font-size:1.2rem;

}


.flap{

position:absolute;

top:0;

width:100%;

height:130px;

background:#ffb6d2;

clip-path:
polygon(
0 0,
100% 0,
50% 100%
);

transform-origin:top;

transition:
transform 1s ease;

z-index:4;

}


.envelope.open .flap{

transform:
rotateX(180deg);

}



.front{

position:absolute;

inset:0;

background:#ff9fc4;

clip-path:
polygon(
0 100%,
50% 45%,
100% 100%
);

z-index:3;

}




/* ------------------
   ECHTER BRIEF
------------------ */


.full-letter{

position:absolute;

width:min(90%,520px);

max-height:80vh;

overflow-y:auto;

scroll-behavior:smooth;

background:white;

}

.full-letter.show{

opacity:1;

transform:
scale(1)
translateY(0);

}



.full-letter h2{

text-align:center;

color:#ff5c9a;

margin-bottom:25px;

}



.message{

color:#555;

line-height:1.9;

white-space:pre-line;

font-size:1rem;

}



.spotify{

display:block;

width:max-content;

margin:30px auto 0;

padding:15px 30px;

border-radius:50px;

background:#1DB954;

color:white;

text-decoration:none;

font-weight:600;

transition:.3s;

}


.spotify:hover{

transform:scale(1.05);

}



.signature{

text-align:center;

margin-top:25px;

color:#ff5c9a;

font-weight:600;

}



.hint{

position:absolute;

bottom:80px;

color:white;

opacity:.8;

}



/* HERZEN */


.heart{

position:fixed;

bottom:-40px;

animation:
float linear forwards;

z-index:1;

}



@keyframes float{

to{

transform:
translateY(-120vh)
rotate(360deg);

opacity:0;

}

}



@media(max-width:600px){

.title{

font-size:2rem;

top:40px;

}


.full-letter{

padding:25px;

max-height:75vh;

}


}


</style>

</head>


<body>


<div class="container">


<h1 class="title">
Baby 🌸
</h1>



<div 
class="envelope"
id="envelope"
onclick="openLetter()">



<div class="back"></div>


<div class="letter-preview">

<h2>
An klenna Brief ❤️
</h2>

</div>


<div class="flap"></div>


<div class="front"></div>


</div>



<div class="full-letter" id="letter">


<h2>
Für di ❤️
</h2>


<div class="message" id="text"></div>



<a 
class="spotify"
href="https://open.spotify.com/track/0MDimlSjIqH6zMGqpfJAew"
target="_blank">

🎵 Just Us

</a>


<div class="signature">

I freu mi, di wiedazumseanna 🤍

</div>


</div>



<div class="hint">

Tippe auf den Umschlag ✉️

</div>


</div>




<script>


const message=`Hey there,

i wollt da wieda mol a klenna Überraschung macha,
und dir säga, dass du ma voll abgosch!

du bisch grad ziemlich wit weg,
und i merk echt wia du ma fehlsch!

Ich hoff aba, dass du a wirklich geile 
Zit in Kanada hosch und viele schöne Momente
sammla ksch und dass du jeda Augablick gnüssesch!

I freu mi trotzdem oh wenn du wieda zruck bisch..

Manchmol merkt ma jo erst wia sehr ma jemand vermisst,
wenn dia Person net grad neaba oanam isch..

I wollt da oafach a klenns Lächla schenka, und dir säga
dass di an di denk. Ganz ganz oft, bzw. dauernd..

Pass gut uf di uf.

Bis ganz bald. ❤️

PS: Aperol gibts natürlich,
wenn wieda do bisch. 🍹`;


let i=0;



function openLetter(){

    const envelope = document.getElementById("envelope");
    const letter = document.getElementById("letter");

    envelope.classList.add("open");


    setTimeout(()=>{

        envelope.classList.add("hide");

        letter.classList.add("show");

        typeText();

    },900);

}


function typeText(){

const textElement = document.getElementById("text");
const letter = document.getElementById("letter");


if(i < message.length){

    textElement.textContent += message.charAt(i);

    i++;

    // sanft nach unten scrollen
    letter.scrollTo({
        top: letter.scrollHeight,
        behavior: "smooth"
    });


    setTimeout(
        typeText,
        35
    );

}

}


function createHeart(){


const h=document.createElement("div");


h.className="heart";


h.innerHTML=
Math.random()>0.5?
"❤️":
"🌸";


h.style.left=
Math.random()*100+"vw";


h.style.fontSize=
(15+Math.random()*20)+"px";


let d=
5+Math.random()*5;


h.style.animationDuration=
d+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},d*1000);


}



setInterval(
createHeart,
350
);



</script>


</body>

</html>
