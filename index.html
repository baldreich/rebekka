<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kommst du heute?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #ffeef5;
}

.box {
    position: relative;
    background: white;
    padding: 45px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    animation: schweben 3s infinite ease-in-out;
}

@keyframes schweben {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

h1 {
    color: #e91e63;
    font-size: 32px;
    margin-bottom: 30px;
}

.buttons {
    position: relative;
    height: 70px;
}

button {
    font-size: 20px;
    padding: 14px 35px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.2s;
}

button:hover {
    transform: scale(1.08);
}

#ja {
    background: #4caf50;
    margin-right: 20px;
}

#nein {
    background: #ff5252;
    position: absolute;
    transition: left 0.25s, top 0.25s;
}

#nachricht {
    display: none;
    margin-top: 25px;
    font-size: 24px;
    color: #e91e63;
    animation: erscheinen 0.8s ease;
}

@keyframes erscheinen {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.herz {
    font-size: 55px;
    display: inline-block;
    animation: pulsieren 1s infinite;
}

@keyframes pulsieren {
    50% {
        transform: scale(1.25);
    }
}

/* Konfetti */
.konfetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fallen 3s linear forwards;
}

@keyframes fallen {
    from {
        transform: translateY(-20px) rotate(0deg);
    }
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="box">

    <h1>😊 Kommst du heute?</h1>

    <div class="buttons">
        <button id="ja">Ja ❤️</button>
        <button id="nein">Nein 😢</button>
    </div>

    <div id="nachricht">
        <div class="herz">💖</div>
        <br>
        Super, freut mich! 🥳<br>
        Bis ca. 17:00 Uhr ⏰😊
    </div>

</div>


<script>

const nein = document.getElementById("nein");
const ja = document.getElementById("ja");
const nachricht = document.getElementById("nachricht");


// Startposition neben Ja
nein.style.left = "180px";
nein.style.top = "0px";


function neinWeg() {

    // nur ein kleiner Sprung rund um den Ja-Button
    const x = Math.random() * 80 - 40;
    const y = Math.random() * 50 - 25;

    nein.style.left = (180 + x) + "px";
    nein.style.top = y + "px";
}

nein.addEventListener("mouseover", neinWeg);
nein.addEventListener("touchstart", neinWeg);


ja.addEventListener("click", () => {

    ja.style.display = "none";
    nein.style.display = "none";

    nachricht.style.display = "block";


    // Konfetti
    for(let i = 0; i < 70; i++) {

        let k = document.createElement("div");
        k.className = "konfetti";

        k.style.left = Math.random() * 100 + "vw";
        k.style.background =
        ["#ff4081","#4caf50","#2196f3","#ff9800","#9c27b0"]
        [Math.floor(Math.random()*5)];

        k.style.animationDuration =
        (2 + Math.random()*3) + "s";

        document.body.appendChild(k);

        setTimeout(() => {
            k.remove();
        }, 5000);
    }

});

</script>

</body>
</html>
