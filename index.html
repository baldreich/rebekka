<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kommst du heute?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Arial", sans-serif;
    overflow: hidden;

    background:
        radial-gradient(circle at top left, #ffd6e0, transparent 35%),
        radial-gradient(circle at bottom right, #c8f7c5, transparent 35%),
        radial-gradient(circle at center, #fff3b0, transparent 40%),
        #dbeafe;
}

.box {
    background: rgba(255,255,255,0.95);
    padding: 45px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: schweben 3s infinite ease-in-out;
}

@keyframes schweben {
    50% {
        transform: translateY(-8px);
    }
}

h1 {
    color: #e91e63;
    font-size: 32px;
    margin-bottom: 30px;
}

.buttons {
    position: relative;
    width: 330px;
    height: 80px;
    margin: auto;
}

button {
    font-size: 20px;
    padding: 14px 35px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

#ja {
    background: #43a047;
    position: absolute;
    left: 20px;
    top: 10px;
}

#nein {
    background: #ef5350;
    position: absolute;
    left: 190px;
    top: 10px;
    transition: all 0.25s ease;
}

button:hover {
    transform: scale(1.08);
}


#nachricht {
    display: none;
    margin-top: 25px;
    font-size: 24px;
    color: #e91e63;
    animation: erscheinen 0.8s ease;
}

@keyframes erscheinen {
    from {
        opacity: 0;
        transform: scale(0.4);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.herz {
    font-size: 55px;
    display: inline-block;
    animation: puls 1s infinite;
}

@keyframes puls {
    50% {
        transform: scale(1.25);
    }
}


/* Konfetti */
.konfetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fallen 3s linear forwards;
}

@keyframes fallen {
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="box">

<h1>😊 Kommst du heute?</h1>

<div class="buttons">
    <button id="ja">Ja ❤️</button>
    <button id="nein">Nein 😢</button>
</div>

<div id="nachricht">
    <div class="herz">💖</div>
    <br>
    Super, freut mich! 🥳<br>
    Bis ca. 17:00 Uhr ⏰😊
</div>

</div>


<script>

const nein = document.getElementById("nein");
const ja = document.getElementById("ja");
const nachricht = document.getElementById("nachricht");


function neinSpringt() {

    // kleine Bewegung rund um den Ja-Button
    let x = 160 + Math.random() * 100;
    let y = Math.random() * 35;

    nein.style.left = x + "px";
    nein.style.top = y + "px";
}

nein.addEventListener("mouseover", neinSpringt);


ja.addEventListener("click", () => {

    ja.style.display = "none";
    nein.style.display = "none";

    nachricht.style.display = "block";


    for(let i = 0; i < 80; i++) {

        let k = document.createElement("div");
        k.className = "konfetti";

        k.style.left = Math.random() * 100 + "vw";
        k.style.top = "-20px";

        k.style.background =
        ["#ff5252","#4caf50","#2196f3","#ffb300","#9c27b0"]
        [Math.floor(Math.random()*5)];

        k.style.animationDuration =
        (2 + Math.random()*3) + "s";

        document.body.appendChild(k);

        setTimeout(() => {
            k.remove();
        }, 5000);
    }

});

</script>

</body>
</html>
