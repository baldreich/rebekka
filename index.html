<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gute Reise, Rebekka ❤️</title>

    <meta name="description"
          content="Eine kleine animierte Abschiedsreise von Zürich nach Kanada.">

    <link rel="icon" href="assets/favicon.svg">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Hintergrund -->

    <div id="sky"></div>

    <div id="sun"></div>

    <div id="cloud-layer-back"></div>

    <div id="cloud-layer-front"></div>



    <!-- Hauptszene -->

    <main id="scene">

        <!-- Überschrift -->

        <section id="intro">

            <h1>Dienstag</h1>

        </section>



        <!-- Zürich -->

        <section id="zurich">

            <div id="mountains-left"></div>

            <div id="city-left"></div>

            <div id="lake-left"></div>

        </section>



        <!-- Karte -->

        <section id="world">

            <svg id="flight-svg">

                <!-- Flugroute -->

                <path
                    id="flight-path"
                    d=""
                />

            </svg>

            <div id="map-container"></div>

        </section>



        <!-- Flugzeug -->

        <section id="plane-section">

            <div id="plane">

                <img
                    src="assets/plane.svg"
                    alt="Flugzeug">

            </div>

        </section>



        <!-- Passagiere -->

        <section id="passengers">

            <div id="window-rebekka"></div>

            <div id="window-boy"></div>

            <div id="window-girl"></div>

        </section>



        <!-- Comicfigur -->

        <section id="friend">

            <img
                src="assets/comic-person.svg"
                alt="Comicfigur">

            <div id="heart"></div>

        </section>



        <!-- Kanada -->

        <section id="canada">

            <div id="mountains-right"></div>

            <div id="forest-right"></div>

            <div id="maple-leaf"></div>

        </section>



        <!-- Abschied -->

        <section id="message">

            <h2>

                Gute Reise,

                <span>Rebekka ❤️</span>

            </h2>

            <p>

                Wir vermissen euch jetzt schon.

            </p>

        </section>

    </main>



    <!-- Optional später Musik -->

    <audio
        id="music"
        preload="auto">

    </audio>



    <script src="script.js"></script>

</body>

</html>
