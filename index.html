<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kommst du heute?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, #ffd6e0, transparent 30%),
        radial-gradient(circle at 80% 80%, #c8f7c5, transparent 30%),
        radial-gradient(circle at 50% 50%, #fff1b8, transparent 35%),
        #dbeafe;
}

.box {
    background: rgba(255,255,255,0.95);
    padding: 45px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: schweben 3s infinite ease-in-out;
}

@keyframes schweben {
    50% {
        transform: translateY(-10px);
    }
}

h1 {
    color: #e91e63;
    font-size: 32px;
    margin-bottom: 30px;
}

button {
    font-size: 20px;
    padding: 14px 35px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    margin: 10px;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#ja {
    background: #43a047;
}

#nein {
    background: #ef5350;
    position: absolute;
    transition: left 0.25s ease, top 0.25s ease;
}


#nachricht {
    display: none;
    margin-top: 25px;
    font-size: 24px;
    color: #e91e63;
    animation: erscheinen 0.8s ease;
}

@keyframes erscheinen {
    from {
        opacity: 0;
        transform: scale(0.4);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.herz {
    font-size: 55px;
    display: inline-block;
    animation: pulsieren 1s infinite;
}

@keyframes pulsieren {
    50% {
        transform: scale(1.3);
    }
}


/* Konfetti */
.konfetti {
    position: fixed;
    width: 12px;
    height: 12px;
    animation: fallen 3s linear forwards;
}

@keyframes fallen {
    from {
        transform: translateY(-20px) rotate(0deg);
    }
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}

</style>
</head>


<body>


<div class="box">

    <h1>😊 Kommst du heute?</h1>

    <button id="ja">Ja ❤️</button>
    <button id="nein">Nein 😢</button>


    <div id="nachricht">
        <div class="herz">💖</div>
        <br>
        Super, freut mich! 🥳<br>
        Bis ca. 17:00 Uhr ⏰😊
    </div>

</div>



<script>

const nein = document.getElementById("nein");
const ja = document.getElementById("ja");
const nachricht = document.getElementById("nachricht");


// Nein startet neben Ja
nein.style.left = "calc(50% + 70px)";
nein.style.top = "50%";


// Button springt weg
function neinWeg() {

    const maxX = window.innerWidth - nein.offsetWidth - 20;
    const maxY = window.innerHeight - nein.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    nein.style.left = x + "px";
    nein.style.top = y + "px";
}


// Maus kommt hin -> weg
nein.addEventListener("mouseover", neinWeg);


// Falls jemand klickt
nein.addEventListener("click", function(e) {
    e.preventDefault();
    neinWeg();
});


// Handy
nein.addEventListener("touchstart", function(e) {
    e.preventDefault();
    neinWeg();
});


// Ja gedrückt
ja.addEventListener("click", () => {

    ja.style.display = "none";
    nein.style.display = "none";

    nachricht.style.display = "block";


    // Konfetti
    for(let i = 0; i < 100; i++) {

        let k = document.createElement("div");
        k.className = "konfetti";

        k.style.left = Math.random() * 100 + "vw";
        k.style.top = "-20px";

        k.style.background =
        [
            "#ff5252",
            "#4caf50",
            "#2196f3",
            "#ffb300",
            "#9c27b0"
        ][Math.floor(Math.random()*5)];


        k.style.animationDuration =
        (2 + Math.random()*3) + "s";


        document.body.appendChild(k);


        setTimeout(() => {
            k.remove();
        }, 5000);
    }

});

</script>


</body>
</html>
