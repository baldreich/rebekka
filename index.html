<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kommst du heute?</title>

<style>
    body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff5f8;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .box {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        color: #e91e63;
    }

    button {
        font-size: 18px;
        padding: 12px 30px;
        margin: 15px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.2s;
    }

    #ja {
        background: #4caf50;
        color: white;
    }

    #nein {
        background: #f44336;
        color: white;
        position: absolute;
    }

    #nachricht {
        display: none;
        margin-top: 25px;
        font-size: 22px;
        color: #4caf50;
        animation: erscheinen 1s ease, hüpfen 2s infinite;
    }

    @keyframes erscheinen {
        from {
            opacity: 0;
            transform: scale(0.5);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes hüpfen {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    .herz {
        font-size: 40px;
        animation: drehen 1.5s infinite;
        display: inline-block;
    }

    @keyframes drehen {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(15deg); }
        100% { transform: rotate(0deg); }
    }
</style>
</head>

<body>

<div class="box">
    <h1>Kommst du heute? 😊</h1>

    <button id="ja">Ja</button>
    <button id="nein">Nein</button>

    <div id="nachricht">
        <span class="herz">❤️</span><br>
        Super, freut mich!<br>
        Bis ca. 17:00 Uhr 😊
    </div>
</div>


<script>
    const nein = document.getElementById("nein");
    const ja = document.getElementById("ja");
    const nachricht = document.getElementById("nachricht");

    function wegMitNein() {
        const maxX = window.innerWidth - nein.offsetWidth;
        const maxY = window.innerHeight - nein.offsetHeight;

        nein.style.left = Math.random() * maxX + "px";
        nein.style.top = Math.random() * maxY + "px";
    }

    nein.addEventListener("mouseover", wegMitNein);
    nein.addEventListener("touchstart", wegMitNein);

    ja.addEventListener("click", () => {
        nachricht.style.display = "block";
        ja.style.display = "none";
        nein.style.display = "none";
    });
</script>

</body>
</html>
