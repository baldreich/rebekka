```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine kleine Frage 😊</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#a18cd1);
}

.card{
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:60px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    min-width:420px;
}

h1{
    font-size:3rem;
    color:white;
    margin-bottom:40px;
}

button{
    border:none;
    cursor:pointer;
    padding:18px 42px;
    border-radius:50px;
    font-size:1.3rem;
    font-weight:bold;
    transition:.25s;
}

#yes{
    background:#4CAF50;
    color:white;
    margin-right:20px;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    background:#e53935;
    color:white;
    position:fixed;
}

.blink{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:.15;
        transform:scale(1.08);
    }
}

.big{
    font-size:5rem;
}

.small{
    font-size:2rem;
    color:white;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="card" id="card">
    <h1 id="question">Kommst du heute? 😊</h1>

    <button id="yes">JA ❤️</button>
    <button id="no">NEIN 😅</button>
</div>

<script>

const question=document.getElementById("question");
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const card=document.getElementById("card");

let step=1;

function moveButton(){

    const padding=20;

    const x=Math.random()*(window.innerWidth-no.offsetWidth-padding);
    const y=Math.random()*(window.innerHeight-no.offsetHeight-padding);

    no.style.left=x+"px";
    no.style.top=y+"px";
}

["mouseenter","mouseover","touchstart"].forEach(event=>{
    no.addEventListener(event,moveButton);
});

yes.addEventListener("click",()=>{

    if(step===1){

        step=2;
        question.innerHTML="Super! 😍<br><br>17:00 Uhr?";
        yes.innerHTML="JA 👍";
        no.innerHTML="NEIN 🙈";

        moveButton();

        return;
    }

    if(step===2){

        document.body.innerHTML=`
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            flex-direction:column;
            color:white;
            text-align:center;
        ">
            <div class="big blink">
                🎉 Perfekt! 🎉
            </div>

            <div class="small">
                Dann bis 17:00 Uhr ❤️😊
            </div>
        </div>`;
    }

});

moveButton();

</script>

</body>
</html>
