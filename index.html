<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gute Reise, Rebekka ❤️</title>

    <meta name="description"
          content="Eine kleine animierte Abschiedsreise von Zürich nach Kanada.">

    <link rel="icon" href="assets/favicon.svg">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Hintergrund -->

    <div id="sky"></div>

    <div id="sun"></div>

    <div id="cloud-layer-back"></div>

    <div id="cloud-layer-front"></div>



    <!-- Hauptszene -->

    <main id="scene">

        <!-- Überschrift -->

        <section id="intro">

            <h1>Dienstag</h1>

        </section>



        <!-- Zürich -->

        <section id="zurich">

            <div id="mountains-left"></div>

            <div id="city-left"></div>

            <div id="lake-left"></div>

        </section>



        <!-- Karte -->

        <section id="world">

            <svg id="flight-svg">

                <!-- Flugroute -->

                <path
                    id="flight-path"
                    d=""
                />

            </svg>

            <div id="map-container"></div>

        </section>



        <!-- Flugzeug -->

<section id="plane-section">

<div id="plane">

<svg id="plane-svg"
     viewBox="0 0 520 180">

    <!-- Flugzeugrumpf -->

    <rect
        x="40"
        y="60"
        rx="45"
        ry="45"
        width="360"
        height="70"
        fill="#ffffff"
        stroke="#d6d6d6"
        stroke-width="3"/>

    <!-- Nase -->

    <ellipse
        cx="400"
        cy="95"
        rx="45"
        ry="35"
        fill="#ffffff"
        stroke="#d6d6d6"
        stroke-width="3"/>

    <!-- Heck -->

    <polygon
        points="
            40,65
            5,20
            50,40
        "
        fill="#d62828"/>

    <!-- Höhenleitwerk -->

    <polygon
        points="
            55,125
            5,155
            70,135
        "
        fill="#d62828"/>

    <!-- Tragfläche -->

    <polygon
        points="
            175,95
            265,25
            320,35
            240,95
        "
        fill="#f2f2f2"
        stroke="#cccccc"/>

    <!-- Untere Tragfläche -->

    <polygon
        points="
            190,100
            285,145
            250,155
            150,105
        "
        fill="#ececec"
        stroke="#cccccc"/>

    <!-- Fenster -->

    <circle id="window1"
            cx="150"
            cy="95"
            r="14"
            fill="#78c7ff"/>

    <circle id="window2"
            cx="200"
            cy="95"
            r="14"
            fill="#78c7ff"/>

    <circle id="window3"
            cx="250"
            cy="95"
            r="14"
            fill="#78c7ff"/>

    <!-- Cockpit -->

    <path
        d="
        M355 75
        Q390 75 392 95
        Q375 90 350 90
        Z"
        fill="#6fb8ff"/>

    <!-- Triebwerk -->

    <ellipse
        cx="255"
        cy="125"
        rx="18"
        ry="10"
        fill="#888"/>

</svg>

</div>

</section>



        <!-- Passagiere -->

        <section id="passengers">

            <div id="window-rebekka"></div>

            <div id="window-boy"></div>

            <div id="window-girl"></div>

        </section>



        <!-- Comicfigur -->

        <section id="friend">

            <img
                src="assets/comic-person.svg"
                alt="Comicfigur">

            <div id="heart"></div>

        </section>



        <!-- Kanada -->

        <section id="canada">

            <div id="mountains-right"></div>

            <div id="forest-right"></div>

            <div id="maple-leaf"></div>

        </section>



        <!-- Abschied -->

        <section id="message">

            <h2>

                Gute Reise,

                <span>Rebekka ❤️</span>

            </h2>

            <p>

                Wir vermissen euch jetzt schon.

            </p>

        </section>

    </main>



    <!-- Optional später Musik -->

    <audio
        id="music"
        preload="auto">

    </audio>



    <script src="script.js"></script>

</body>

</html>
