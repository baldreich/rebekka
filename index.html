<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>REBEKKA</title>

<style>

/* =========================================================
   GRUNDLAYOUT
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Courier New", monospace;
    cursor: default;
    user-select: none;
}


/* =========================================================
   CANVAS
========================================================= */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#matrix {
    z-index: 1;
}

#particles {
    z-index: 3;
}


/* =========================================================
   SCANLINES
========================================================= */

#scanlines {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,65,.035) 0px,
            rgba(0,255,65,.035) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity: .6;
}


/* =========================================================
   HINWEIS
========================================================= */

#hint {
    position: fixed;

    bottom: 25px;
    left: 0;

    width: 100%;

    z-index: 20;

    text-align: center;

    color: rgba(0,255,65,.42);

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 4px;

    transition:
        opacity .7s ease,
        transform .7s ease;
}

#hint.hide {
    opacity: 0;
    transform: translateY(10px);
}


/* =========================================================
   UNSICHTBARER CLICK-BEREICH
   ========================================================= */

#nameButton {
    position: fixed;

    z-index: 30;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 900px);
    height: min(45vw, 250px);

    cursor: pointer;

    /*
       Der Bereich ist unsichtbar,
       liegt aber genau über REBEKKA.
    */

    background: transparent;

    border: none;

    outline: none;
}


/* =========================================================
   EASTER EGG
========================================================= */

#easterEgg {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.86);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#easterEgg.show {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   KARTE
========================================================= */

.card {

    width: min(520px, 92vw);

    padding: 38px 25px;

    position: relative;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(0,28,8,.97),
            rgba(0,5,2,.99)
        );

    border:
        1px solid
        rgba(0,255,65,.8);

    box-shadow:

        0 0 15px
        rgba(0,255,65,.3),

        0 0 50px
        rgba(0,255,65,.15),

        inset 0 0 35px
        rgba(0,255,65,.05);

    transform:
        scale(.7)
        translateY(30px);

    transition:
        transform .8s
        cubic-bezier(.16,1,.3,1);

    overflow: hidden;
}

#easterEgg.show .card {

    transform:
        scale(1)
        translateY(0);
}


/* =========================================================
   SCANNER AUF KARTE
========================================================= */

.card::before {

    content: "";

    position: absolute;

    left: -100%;
    top: 0;

    width: 100%;
    height: 1px;

    background: #00ff41;

    box-shadow:
        0 0 10px #00ff41,
        0 0 25px #00ff41;

    animation:
        scanCard 2.5s linear infinite;
}

@keyframes scanCard {

    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }
}


/* =========================================================
   SECRET HEADER
========================================================= */

.secretHeader {

    color:
        rgba(0,255,65,.5);

    font-size: 10px;

    letter-spacing: 4px;

    margin-bottom: 20px;
}


/* =========================================================
   REBEKKA IM EASTER EGG
========================================================= */

.secretName {

    color: #00ff41;

    font-size:
        clamp(
            28px,
            8vw,
            50px
        );

    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:

        0 0 5px #00ff41,

        0 0 15px #00ff41,

        0 0 35px #00ff41,

        0 0 60px
        rgba(0,255,65,.6);
}


/* =========================================================
   APEROL
========================================================= */

.aperol {

    font-size: 46px;

    margin:
        20px 0;

    animation:
        aperolFloat 2.5s
        ease-in-out
        infinite;
}

@keyframes aperolFloat {

    0%,100% {
        transform:
            translateY(0)
            rotate(-4deg);
    }

    50% {
        transform:
            translateY(-9px)
            rotate(4deg);
    }
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    color: #d8ffe2;

    font-family:
        Arial,
        sans-serif;

    font-size: 18px;

    line-height: 1.7;
}

.message strong {

    color: #00ff41;

    text-shadow:
        0 0 8px
        rgba(0,255,65,.7);
}


/* =========================================================
   CLOSE
========================================================= */

#close {

    display: inline-block;

    margin-top: 25px;

    padding:
        10px 22px;

    border:
        1px solid
        rgba(0,255,65,.55);

    color:
        rgba(0,255,65,.7);

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease;
}

#close:hover {

    background: #00ff41;

    color: #000;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #nameButton {

        width: 96vw;

        height: 35vw;
    }

    .card {

        padding:
            32px 18px;
    }

    .message {

        font-size: 16px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     MATRIX HINTERGRUND
======================================================= -->

<canvas id="matrix"></canvas>


<!-- =======================================================
     REBEKKA PARTICLES
======================================================= -->

<canvas id="particles"></canvas>


<!-- =======================================================
     SCANLINES
======================================================= -->

<div id="scanlines"></div>


<!-- =======================================================
     HINWEIS
======================================================= -->

<div id="hint">
    TAP REBEKKA
</div>


<!-- =======================================================
     UNSICHTBARER BUTTON ÜBER REBEKKA
======================================================= -->

<button id="nameButton"
        aria-label="REBEKKA">
</button>


<!-- =======================================================
     EASTER EGG
======================================================= -->

<div id="easterEgg">

    <div class="card">

        <div class="secretHeader">
            // SECRET MESSAGE FOUND //
        </div>


        <div class="secretName">
            REBEKKA
        </div>


        <div class="aperol">
            🍹
        </div>


        <div class="message">

           <strong>
            Gutschein für 
            <br>
       

         
             an Aperol?
            </strong>

            😉

            <br><br>

            I lad di i, du woasch wo

        </div>


        <div id="close">
            CLOSE
        </div>

    </div>

</div>


<script>


/* =========================================================
   MATRIX ZEICHEN
========================================================= */

const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "0123456789" +
    "@#$%&*+=<>/" +
    "アカサタナハマヤラワ";


/* =========================================================
   MATRIX BACKGROUND
========================================================= */

const matrixCanvas =
    document.getElementById(
        "matrix"
    );

const mctx =
    matrixCanvas.getContext(
        "2d"
    );

let W;
let H;

let fontSize;
let columns;
let drops;


function resizeMatrix() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    matrixCanvas.width =
        W * dpr;

    matrixCanvas.height =
        H * dpr;


    matrixCanvas.style.width =
        W + "px";

    matrixCanvas.style.height =
        H + "px";


    mctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    fontSize =
        W < 600
            ? 14
            : 17;


    columns =
        Math.ceil(
            W / fontSize
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() *
            -H / fontSize;
    }
}


resizeMatrix();


window.addEventListener(
    "resize",
    resizeMatrix
);


function drawMatrix() {

    /*
       schwarzer Schleier,
       dadurch entstehen die
       langen Matrix-Spuren.
    */

    mctx.fillStyle =
        "rgba(0,0,0,.075)";

    mctx.fillRect(
        0,
        0,
        W,
        H
    );


    mctx.font =
        fontSize +
        "px Courier New";


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const char =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        const x =
            i * fontSize;

        const y =
            drops[i] *
            fontSize;


        /*
           gelegentlich ein fast
           weiß-grüner Kopf
        */

        if (
            Math.random() > .94
        ) {

            mctx.fillStyle =
                "#c8ffd4";

        } else {

            mctx.fillStyle =
                "#00ff41";
        }


        mctx.shadowBlur = 8;

        mctx.shadowColor =
            "#00ff41";


        mctx.fillText(
            char,
            x,
            y
        );


        mctx.shadowBlur = 0;


        drops[i] +=
            .45 +
            Math.random() * .65;


        if (
            y > H &&
            Math.random() > .975
        ) {

            drops[i] =
                Math.random() * -20;
        }
    }


    requestAnimationFrame(
        drawMatrix
    );
}


drawMatrix();


/* =========================================================
   REBEKKA PARTICLES
========================================================= */

const particleCanvas =
    document.getElementById(
        "particles"
    );

const ctx =
    particleCanvas.getContext(
        "2d"
    );


let particles = [];

let targetPoints = [];

let animationStart =
    performance.now();


let phase =
    "forming";


/* =========================================================
   ERSTELLE DIE PIXEL-MASKE
========================================================= */

function createTargetPoints() {

    const offscreen =
        document.createElement(
            "canvas"
        );


    const octx =
        offscreen.getContext(
            "2d"
        );


    offscreen.width = W;

    offscreen.height = H;


    /*
       Schriftgröße automatisch
       an Bildschirm anpassen.
    */

    let fontSize =
        Math.min(
            W * .22,
            H * .30,
            230
        );


    /*
       Auf Smartphones etwas
       kompakter.
    */

    if (
        W < 600
    ) {

        fontSize =
            Math.min(
                W * .20,
                125
            );
    }


    octx.font =
        "900 " +
        fontSize +
        "px Arial";


    octx.textAlign =
        "center";


    octx.textBaseline =
        "middle";


    octx.fillStyle =
        "#ffffff";


    /*
       HIER WIRD REBEKKA
       ALS MASKE GEZEICHNET
    */

    octx.fillText(
        "REBEKKA",
        W / 2,
        H / 2
    );


    /*
       Pixel auslesen
    */

    const image =
        octx.getImageData(
            0,
            0,
            W,
            H
        );


    targetPoints = [];


    /*
       Abstand zwischen den
       einzelnen Matrix-Zeichen.

       kleiner = mehr Zeichen
    */

    const step =
        W < 600
            ? 4
            : 5;


    for (
        let y = 0;
        y < H;
        y += step
    ) {

        for (
            let x = 0;
            x < W;
            x += step
        ) {

            const index =
                (
                    y * W +
                    x
                ) * 4;


            /*
               Wenn dieser Pixel
               innerhalb des Buchstabens
               liegt, kommt hier ein
               Matrix-Zeichen hin.
            */

            if (
                image.data[
                    index + 3
                ] > 100
            ) {

                targetPoints.push({
                    x: x,
                    y: y
                });
            }
        }
    }


    createParticles();
}


/* =========================================================
   PARTICLES ERZEUGEN
========================================================= */

function createParticles() {

    particles = [];


    for (
        let i = 0;
        i < targetPoints.length;
        i++
    ) {

        const target =
            targetPoints[i];


        particles.push({

            /*
               Startposition:
               irgendwo auf dem Bildschirm
            */

            x:
                Math.random() * W,

            y:
                Math.random() * H,


            /*
               Zielposition:
               exakter Punkt in REBEKKA
            */

            targetX:
                target.x,

            targetY:
                target.y,


            /*
               Anfangsbewegung
            */

            vx:
                (Math.random() - .5) * 8,

            vy:
                (Math.random() - .5) * 8,


            /*
               zufälliges Matrix-Zeichen
            */

            char:
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ],


            size:
                W < 600
                    ? 10
                    : 13,


            alpha:
                .2 +
                Math.random() * .8,


            /*
               Jedes Zeichen
               startet leicht versetzt.
            */

            delay:
                Math.random() * 1500,


            arrived:
                false
        });
    }
}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeParticles() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    particleCanvas.width =
        W * dpr;

    particleCanvas.height =
        H * dpr;


    particleCanvas.style.width =
        W + "px";

    particleCanvas.style.height =
        H + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createTargetPoints();
}


resizeParticles();


window.addEventListener(
    "resize",
    resizeParticles
);


/* =========================================================
   PARTICLE ANIMATION
========================================================= */

function animate(now) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const elapsed =
        now -
        animationStart;


    let arrivedCount = 0;


    for (
        const p of particles
    ) {


        /*
           NACH DER STARTPHASE:
           Zeichen fliegen zu
           ihrem REBEKKA-Pixel.
        */

        if (
            elapsed >
            900 + p.delay
        ) {

            const dx =
                p.targetX -
                p.x;

            const dy =
                p.targetY -
                p.y;


            /*
               Feder-Effekt
            */

            p.vx +=
                dx * .0027;

            p.vy +=
                dy * .0027;


            p.vx *= .84;

            p.vy *= .84;


            p.x +=
                p.vx;

            p.y +=
                p.vy;


            if (
                Math.abs(dx) < 1.2 &&
                Math.abs(dy) < 1.2
            ) {

                p.arrived =
                    true;
            }
        }


        /*
           Zähle fertige Zeichen
        */

        if (
            p.arrived
        ) {

            arrivedCount++;
        }


        /*
           Matrix-Zeichen gelegentlich
           wechseln
        */

        if (
            Math.random() < .035
        ) {

            p.char =
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];
        }


        /*
           Angekommene Zeichen
           leuchten stärker.
        */

        ctx.globalAlpha =
            p.arrived
                ? .95
                : p.alpha;


        ctx.font =
            p.size +
            "px Courier New";


        ctx.fillStyle =
            p.arrived
                ? "#00ff41"
                : "#00b82f";


        ctx.shadowBlur =
            p.arrived
                ? 9
                : 3;


        ctx.shadowColor =
            "#00ff41";


        ctx.fillText(
            p.char,
            p.x,
            p.y
        );
    }


    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;


    /*
       Wenn fast alle Zeichen
       angekommen sind:
       REBEKKA steht fertig da.
    */

    if (
        arrivedCount >
        particles.length * .97 &&
        phase === "forming"
    ) {

        phase =
            "formed";


        /*
           5 Sekunden stehen lassen
        */

        setTimeout(
            dissolve,
            5000
        );
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   ZERFALL
========================================================= */

function dissolve() {

    phase =
        "dissolving";


    for (
        const p of particles
    ) {

        /*
           Jedes Zeichen bekommt
           eine zufällige Flugrichtung.
        */

        p.vx =
            (Math.random() - .5) *
            12;

        p.vy =
            (Math.random() - .5) *
            12;


        p.arrived =
            false;
    }


    /*
       Danach wieder neu aufbauen
    */

    setTimeout(
        restart,
        2200
    );
}


/* =========================================================
   NEUER AUFBAU
========================================================= */

function restart() {

    animationStart =
        performance.now();


    phase =
        "forming";


    for (
        const p of particles
    ) {

        p.x =
            Math.random() * W;

        p.y =
            Math.random() * H;


        p.vx =
            (Math.random() - .5) *
            8;

        p.vy =
            (Math.random() - .5) *
            8;


        p.delay =
            Math.random() * 1500;


        p.arrived =
            false;
    }
}


/* =========================================================
   START ANIMATION
========================================================= */

requestAnimationFrame(
    animate
);


/* =========================================================
   EASTER EGG ÖFFNEN
========================================================= */

const nameButton =
    document.getElementById(
        "nameButton"
    );


const easterEgg =
    document.getElementById(
        "easterEgg"
    );


const hint =
    document.getElementById(
        "hint"
    );


function openEasterEgg() {

    easterEgg.classList.add(
        "show"
    );

    hint.classList.add(
        "hide"
    );
}


/*
   PC:
   Klick auf REBEKKA
*/

nameButton.addEventListener(
    "click",
    function() {

        openEasterEgg();

    }
);


/*
   Smartphone:
   Tipp auf REBEKKA
*/

nameButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        openEasterEgg();

    },
    {
        passive: false
    }
);


/* =========================================================
   EASTER EGG SCHLIESSEN
========================================================= */

document.getElementById(
    "close"
).addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        easterEgg.classList.remove(
            "show"
        );


        setTimeout(
            function() {

                hint.classList.remove(
                    "hide"
                );

            },
            700
        );
    }
);


/*
   Klick außerhalb der Karte
   schließt ebenfalls.
*/

easterEgg.addEventListener(
    "click",
    function(e) {

        if (
            e.target ===
            easterEgg
        ) {

            easterEgg.classList.remove(
                "show"
            );

            setTimeout(
                function() {

                    hint.classList.remove(
                        "hide"
                    );

                },
                700
            );
        }
    }
);

</script>

</body>
</html>
