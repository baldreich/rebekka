<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>REBEKKA</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Courier New", monospace;
    cursor: pointer;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#matrix {
    z-index: 1;
}

#particles {
    z-index: 3;
}

#scanlines {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,65,.035) 0px,
            rgba(0,255,65,.035) 1px,
            transparent 1px,
            transparent 4px
        );
}

#hint {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;

    color: rgba(0,255,65,.45);

    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 4px;

    z-index: 20;

    transition: opacity .7s;
}

#hint.hide {
    opacity: 0;
}


/* =========================
   EASTER EGG
========================= */

#easterEgg {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.82);

    z-index: 100;

    opacity: 0;
    visibility: hidden;

    transition: opacity .7s;
}

#easterEgg.show {
    opacity: 1;
    visibility: visible;
}

.card {
    width: min(520px, 90vw);

    padding: 38px 25px;

    border: 1px solid #00ff41;

    background:
        linear-gradient(
            145deg,
            rgba(0,25,7,.97),
            rgba(0,5,2,.98)
        );

    box-shadow:
        0 0 20px rgba(0,255,65,.35),
        0 0 70px rgba(0,255,65,.15),
        inset 0 0 30px rgba(0,255,65,.05);

    text-align: center;

    transform: scale(.7);

    transition:
        transform .8s cubic-bezier(.16,1,.3,1);
}

#easterEgg.show .card {
    transform: scale(1);
}

.secret {
    color: #00ff41;

    font-size: clamp(27px, 8vw, 48px);

    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:
        0 0 5px #00ff41,
        0 0 15px #00ff41,
        0 0 35px #00ff41;
}

.aperol {
    font-size: 45px;
    margin: 20px 0;

    animation:
        float 2s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(-4deg);
    }

    50% {
        transform: translateY(-8px) rotate(4deg);
    }
}

.message {
    color: #d7ffe1;

    font-family: Arial, sans-serif;

    font-size: 18px;

    line-height: 1.7;
}

.message strong {
    color: #00ff41;
}

.close {
    display: inline-block;

    margin-top: 25px;

    padding: 10px 20px;

    border: 1px solid rgba(0,255,65,.6);

    color: rgba(0,255,65,.7);

    font-size: 11px;

    letter-spacing: 3px;
}

.close:hover {
    background: #00ff41;
    color: #000;
}
</style>
</head>


<body>

<canvas id="matrix"></canvas>
<canvas id="particles"></canvas>

<div id="scanlines"></div>

<div id="hint">
    DOUBLE TAP
</div>


<div id="easterEgg">

    <div class="card">

        <div style="
            color:rgba(0,255,65,.5);
            font-size:11px;
            letter-spacing:4px;
            margin-bottom:18px;
        ">
            // SECRET MESSAGE FOUND //
        </div>

        <div class="secret">
            REBEKKA
        </div>

        <div class="aperol">
            🍹
        </div>

        <div class="message">
            Manches muss ma <br>
            net lang plana.<br><br>

            <strong>Aperol?</strong> 😉<br><br>

            Ich lad di i. Du woasch wo 😉
        </div>

        <div class="close" id="close">
            CLOSE
        </div>

    </div>

</div>


<script>

/* =========================================================
   MATRIX REGEN
========================================================= */

const matrixCanvas =
    document.getElementById("matrix");

const mctx =
    matrixCanvas.getContext("2d");

let W;
let H;

let fontSize;
let columns;
let drops;

const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "0123456789" +
    "@#$%&*+=<>アカサタナハマヤラワ";

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    matrixCanvas.width = W * dpr;
    matrixCanvas.height = H * dpr;

    matrixCanvas.style.width = W + "px";
    matrixCanvas.style.height = H + "px";

    mctx.setTransform(dpr,0,0,dpr,0,0);

    fontSize = W < 600 ? 14 : 17;

    columns =
        Math.ceil(W / fontSize);

    drops = [];

    for(let i=0; i<columns; i++) {

        drops[i] =
            Math.random() *
            -H / fontSize;
    }
}

resize();

window.addEventListener(
    "resize",
    resize
);


function matrixRain() {

    mctx.fillStyle =
        "rgba(0,0,0,.075)";

    mctx.fillRect(
        0,
        0,
        W,
        H
    );

    mctx.font =
        fontSize +
        "px Courier New";

    for(let i=0; i<columns; i++) {

        const char =
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

        const x =
            i * fontSize;

        const y =
            drops[i] * fontSize;

        mctx.fillStyle =
            Math.random() > .93
                ? "#c8ffd4"
                : "#00ff41";

        mctx.shadowBlur = 8;
        mctx.shadowColor = "#00ff41";

        mctx.fillText(
            char,
            x,
            y
        );

        mctx.shadowBlur = 0;

        drops[i] +=
            .45 +
            Math.random() * .7;

        if(
            y > H &&
            Math.random() > .97
        ) {
            drops[i] =
                Math.random() * -20;
        }
    }

    requestAnimationFrame(
        matrixRain
    );
}

matrixRain();


/* =========================================================
   REBEKKA AUS HUNDERTEN ZEICHEN
========================================================= */

const particleCanvas =
    document.getElementById("particles");

const ctx =
    particleCanvas.getContext("2d");

let particles = [];

let targetPoints = [];

let animationStart =
    performance.now();

let phase =
    "forming";


function resizeParticles() {

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    particleCanvas.width =
        W * dpr;

    particleCanvas.height =
        H * dpr;

    particleCanvas.style.width =
        W + "px";

    particleCanvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createTargetPoints();
}

window.addEventListener(
    "resize",
    resizeParticles
);


/*
   Hier wird REBEKKA als echte Pixel-Maske
   erzeugt.
*/

function createTargetPoints() {

    const off =
        document.createElement("canvas");

    const octx =
        off.getContext("2d");

    off.width = W;
    off.height = H;

    const fontSize =
        Math.min(
            W * .22,
            H * .30,
            230
        );

    octx.font =
        "900 " +
        fontSize +
        "px Arial";

    octx.textAlign =
        "center";

    octx.textBaseline =
        "middle";

    octx.fillStyle =
        "white";

    octx.fillText(
        "REBEKKA",
        W / 2,
        H / 2
    );

    const image =
        octx.getImageData(
            0,
            0,
            W,
            H
        );

    targetPoints = [];

    /*
       Je größer STEP, desto weniger Zeichen.
       3 = sehr viele Zeichen.
    */

    const step =
        W < 600 ? 5 : 6;

    for(
        let y=0;
        y<H;
        y+=step
    ) {

        for(
            let x=0;
            x<W;
            x+=step
        ) {

            const index =
                (y * W + x) * 4;

            if(
                image.data[index + 3] > 100
            ) {

                targetPoints.push({
                    x,
                    y
                });
            }
        }
    }

    createParticles();
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    particles = [];

    /*
       Jede Position des Schriftzuges
       bekommt ein eigenes Matrix-Zeichen.
    */

    for(
        let i=0;
        i<targetPoints.length;
        i++
    ) {

        const target =
            targetPoints[i];

        particles.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            targetX:
                target.x,

            targetY:
                target.y,

            vx:
                (Math.random()-.5)*8,

            vy:
                (Math.random()-.5)*8,

            char:
                chars[
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                ],

            size:
                W < 600 ? 11 : 14,

            delay:
                Math.random() * 1600,

            alpha:
                .2 +
                Math.random() * .8,

            arrived:
                false
        });
    }
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(now) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const elapsed =
        now - animationStart;

    for(
        const p of particles
    ) {

        /*
           Erst Chaos.
           Danach zieht jedes Zeichen
           zu seiner exakten Zielposition.
        */

        if(
            elapsed >
            1000 + p.delay
        ) {

            const dx =
                p.targetX - p.x;

            const dy =
                p.targetY - p.y;

            /*
               Federartige Bewegung
            */

            p.vx +=
                dx * .0025;

            p.vy +=
                dy * .0025;

            p.vx *= .84;
            p.vy *= .84;

            p.x += p.vx;
            p.y += p.vy;

            if(
                Math.abs(dx) < 1 &&
                Math.abs(dy) < 1
            ) {
                p.arrived = true;
            }

        } else {

            /*
               Anfangsphase:
               zufällige Matrix-Partikel
            */

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= .99;
            p.vy *= .99;

            if(
                p.x < 0 ||
                p.x > W
            ) {
                p.vx *= -1;
            }

            if(
                p.y < 0 ||
                p.y > H
            ) {
                p.vy *= -1;
            }
        }


        /*
           Zeichen leicht wechseln,
           damit es nach echtem Matrix-Code aussieht.
        */

        if(
            Math.random() < .035
        ) {

            p.char =
                chars[
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                ];
        }


        /*
           Wenn das Zeichen angekommen ist,
           wird es heller.
        */

        ctx.globalAlpha =
            p.arrived
                ? .9
                : p.alpha;

        ctx.font =
            p.size +
            "px Courier New";

        ctx.fillStyle =
            p.arrived
                ? "#00ff41"
                : "#00b82f";

        ctx.shadowBlur =
            p.arrived ? 10 : 4;

        ctx.shadowColor =
            "#00ff41";

        ctx.fillText(
            p.char,
            p.x,
            p.y
        );
    }

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;


    /*
       Wenn die meisten Partikel angekommen sind,
       wird die Schrift für einen Moment stabil.
    */

    const arrived =
        particles.filter(
            p => p.arrived
        ).length;

    if(
        arrived >
        particles.length * .96 &&
        phase === "forming"
    ) {

        phase = "formed";

        setTimeout(
            startDissolve,
            5000
        );
    }

    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   REBEKKA ZERFÄLLT
========================================================= */

function startDissolve() {

    phase =
        "dissolving";

    for(
        const p of particles
    ) {

        /*
           Die Zeichen fliegen wieder auseinander.
        */

        p.vx =
            (Math.random()-.5) *
            12;

        p.vy =
            (Math.random()-.5) *
            12;

        p.arrived =
            false;
    }

    setTimeout(
        startFormAgain,
        2200
    );
}


/* =========================================================
   ERNEUTER AUFBAU
========================================================= */

function startFormAgain() {

    animationStart =
        performance.now();

    phase =
        "forming";

    for(
        const p of particles
    ) {

        /*
           Alle Zeichen starten wieder irgendwo
           im Matrix-Regen.
        */

        p.x =
            Math.random() * W;

        p.y =
            Math.random() * H;

        p.vx =
            (Math.random()-.5)*8;

        p.vy =
            (Math.random()-.5)*8;

        p.delay =
            Math.random()*1600;

        p.arrived =
            false;
    }
}


/* Start */

resizeParticles();

requestAnimationFrame(
    animate
);


/* =========================================================
   DOUBLE TAP / DOUBLE CLICK
========================================================= */

const easterEgg =
    document.getElementById(
        "easterEgg"
    );

const hint =
    document.getElementById(
        "hint"
    );

let lastTap = 0;


function openEgg() {

    easterEgg.classList.add(
        "show"
    );

    hint.classList.add(
        "hide"
    );
}


/* Desktop */

document.addEventListener(
    "dblclick",
    function(e) {

        if(
            !e.target.closest(".card")
        ) {
            openEgg();
        }
    }
);


/* Smartphone */

document.addEventListener(
    "touchend",
    function(e) {

        const now =
            Date.now();

        if(
            now - lastTap < 350
        ) {

            e.preventDefault();

            openEgg();
        }

        lastTap = now;

    },
    { passive:false }
);


/* =========================================================
   CLOSE
========================================================= */

document.getElementById(
    "close"
).addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        easterEgg.classList.remove(
            "show"
        );

        setTimeout(
            () =>
                hint.classList.remove(
                    "hide"
                ),
            700
        );
    }
);


/* Klick außerhalb */

easterEgg.addEventListener(
    "click",
    function(e) {

        if(
            e.target === easterEgg
        ) {

            easterEgg.classList.remove(
                "show"
            );

            setTimeout(
                () =>
                    hint.classList.remove(
                        "hide"
                    ),
                700
            );
        }
    }
);

</script>

</body>
</html>
