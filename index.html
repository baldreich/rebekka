<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Rebekkas Reise: Zürich → Kanada → Québec → Ferienhaus am See</title>
<style>
  :root{
    --sky-top:#7ec8f2;
    --sky-bottom:#e9f7ff;
    --ink:#232323;
    --paper:#fff8ec;
    --accent:#ff5b6a;
    --accent2:#ffd23f;
    --accent3:#4cd4a0;
    --quebec-blue:#003399;
    --lake-blue:#3aa0d1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Comic Sans MS','Marker Felt',Arial,sans-serif;background:var(--paper);}

  .stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  .stage::before{
    content:"";
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(0,0,0,0.05) 1px,transparent 1.5px);
    background-size:6px 6px;
    pointer-events:none;
    z-index:50;
  }

  .panel-border{
    position:absolute;inset:8px;
    border:6px solid var(--ink);
    border-radius:14px;
    z-index:51;
    pointer-events:none;
    box-shadow:0 0 0 3px var(--paper) inset;
  }

  .title{
    position:absolute; top:14px; left:50%;
    transform:translateX(-50%);
    z-index:55; text-align:center; color:var(--ink);
  }
  .title h1{
    margin:0;
    font-size:clamp(16px,2.8vw,28px);
    background:var(--accent2);
    border:4px solid var(--ink);
    border-radius:12px;
    padding:6px 20px;
    box-shadow:6px 6px 0 var(--ink);
    transform:rotate(-2deg);
    transition:opacity 0.6s ease;
    white-space:nowrap;
  }

  .progress{
    position:absolute;
    top:64px; left:50%; transform:translateX(-50%);
    z-index:55;
    display:flex; gap:8px;
  }
  .progress span{
    width:10px;height:10px;border-radius:50%;
    background:#fff; border:3px solid var(--ink);
    transition:background 0.3s ease;
  }
  .progress span.on{ background:var(--accent); }

  /* ===== SCENES ===== */
  .scene{
    position:absolute; inset:0;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
  }
  .scene.active{ opacity:1; pointer-events:auto; }

  /* ---------- SCENE 1: TRAIN TO ZÜRICH AIRPORT ---------- */
  #scene-train{ background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 65%); }
  .sun{
    position:absolute; top:6%; right:10%;
    width:80px;height:80px;
    background:var(--accent2);
    border-radius:50%;
    border:5px solid var(--ink);
    box-shadow:0 0 0 8px rgba(255,210,63,0.35);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .cloud{ position:absolute; background:#fff; border:4px solid var(--ink); border-radius:50px; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border:4px solid var(--ink); border-radius:50%; }
  .cloud1{width:110px;height:40px;top:12%;}
  .cloud1::before{width:54px;height:54px;top:-30px;left:8px;}
  .cloud1::after{width:64px;height:64px;top:-36px;left:46px;}
  .cloud2{width:90px;height:34px;top:24%;}
  .cloud2::before{width:44px;height:44px;top:-24px;left:8px;}
  .cloud2::after{width:50px;height:50px;top:-28px;left:38px;}
  .drift{ animation:driftAcross linear infinite; }
  @keyframes driftAcross{from{transform:translateX(-160px);}to{transform:translateX(calc(100vw + 200px));}}
  .cloud1{ animation-duration:30s; }
  .cloud2{ animation-duration:38s; animation-delay:-10s; }

  .hills{ position:absolute; bottom:14%; left:0; right:0; height:60px; background:var(--accent3); border-top:5px solid var(--ink); }
  .track{
    position:absolute; bottom:12%; left:0; right:0; height:22px;
    background:repeating-linear-gradient(90deg,#8a5a3a 0 22px, #6b4327 22px 26px);
    border-top:5px solid var(--ink); border-bottom:5px solid var(--ink);
  }

  .train-wrap{ position:absolute; bottom:12%; left:-560px; animation:trainRide 7s linear infinite; }
  @keyframes trainRide{
    0%{ left:-560px; }
    55%{ left:50%; transform:translateX(-50%); }
    80%{ left:50%; transform:translateX(-50%); }
    100%{ left:110%; transform:translateX(0); }
  }

  .smoke{
    position:absolute; top:-10px; left:70px;
    width:24px;height:24px; background:#fff;
    border:3px solid var(--ink); border-radius:50%;
    opacity:0.85; animation:puff 1.6s ease-out infinite;
  }
  .smoke:nth-child(2){ animation-delay:0.5s; left:90px; }
  .smoke:nth-child(3){ animation-delay:1s; left:110px; }
  @keyframes puff{
    0%{ transform:translateY(0) scale(0.6); opacity:0.9; }
    100%{ transform:translateY(-70px) scale(1.6); opacity:0; }
  }

  .airport-sign{
    position:absolute; top:16%; left:50%;
    transform:translateX(-50%) scale(0.8);
    background:var(--paper); border:4px solid var(--ink); border-radius:10px;
    padding:8px 22px; font-weight:bold; font-size:18px;
    opacity:0; animation:signPop 7s ease-in-out infinite; z-index:10;
  }
  @keyframes signPop{
    0%,50%{ opacity:0; transform:translateX(-50%) scale(0.7); }
    62%{ opacity:1; transform:translateX(-50%) scale(1.05); }
    75%,100%{ opacity:1; transform:translateX(-50%) scale(1); }
  }

  /* ---------- SCENE 2: PLANE TO CANADA ---------- */
  #scene-plane{ background:linear-gradient(180deg,#5a9fd6 0%,#bfe3ff 55%,#e9f7ff 100%); }
  .plane-wrap{
    position:absolute; top:30%; left:-260px;
    animation:flyAcross 8s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes flyAcross{
    0%{ left:-260px; top:46%; transform:rotate(-4deg); }
    45%{ top:14%; transform:rotate(-8deg); }
    55%{ top:14%; transform:rotate(4deg); }
    100%{ left:112%; top:40%; transform:rotate(4deg); }
  }
  .plane{ position:relative; width:220px; animation:bob 1.4s ease-in-out infinite; }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .trail{
    position:absolute; right:100%; top:50%;
    width:220px;height:14px; transform:translateY(-50%);
    background:repeating-linear-gradient(90deg,rgba(255,255,255,0.9) 0 14px, transparent 14px 26px);
    filter:blur(0.5px); z-index:-1;
  }
  .bubble{
    position:absolute; background:var(--paper); border:4px solid var(--ink);
    border-radius:16px; padding:6px 12px; font-size:13px; font-weight:bold;
    white-space:nowrap; top:-50px; left:50px;
    animation:bubbleFloat 3s ease-in-out infinite; z-index:5;
  }
  .bubble::after{
    content:""; position:absolute; bottom:-14px; left:26px;
    border-width:14px 10px 0 0; border-style:solid;
    border-color:var(--ink) transparent transparent transparent;
  }
  .bubble::before{
    content:""; position:absolute; bottom:-9px; left:29px;
    border-width:11px 7px 0 0; border-style:solid;
    border-color:var(--paper) transparent transparent transparent; z-index:1;
  }
  @keyframes bubbleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  .globe{
    position:absolute; top:60%; left:50%;
    width:200px;height:200px;
    transform:translate(-50%,-50%) scale(0.3);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bfe3ff, #4d84c4 70%);
    border:6px solid var(--ink);
    opacity:0;
    animation:globeZoom 8s ease-in-out infinite;
  }
  @keyframes globeZoom{
    0%,30%{ opacity:0; transform:translate(-50%,-50%) scale(0.2); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    75%{ opacity:1; transform:translate(-50%,-50%) scale(1.2); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.5); }
  }
  .maple-big{
    position:absolute; top:60%; left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-size:90px; opacity:0;
    animation:mapleIn 8s ease-in-out infinite; z-index:5;
  }
  @keyframes mapleIn{
    0%,45%{ opacity:0; transform:translate(-50%,-50%) scale(0); }
    60%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
    70%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    95%,100%{ opacity:0; transform:translate(-50%,-50%) scale(1.3); }
  }
  .canada-text{
    position:absolute; top:78%; left:50%;
    transform:translate(-50%,0);
    font-size:clamp(20px,4vw,40px); font-weight:bold; color:#fff;
    text-shadow:3px 3px 0 var(--ink); letter-spacing:1px;
    opacity:0; animation:textUp 8s ease-in-out infinite; white-space:nowrap;
  }
  @keyframes textUp{
    0%,55%{ opacity:0; transform:translate(-50%,20px); }
    68%{ opacity:1; transform:translate(-50%,0); }
    90%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-20px); }
  }

  /* ---------- SCENE 3: QUÉBEC ---------- */
  #scene-quebec{ background:linear-gradient(180deg,#9fd3f0 0%,#e9f7ff 60%); }
  .quebec-skyline{ position:absolute; bottom:10%; left:0; right:0; height:40%; display:flex; align-items:flex-end; justify-content:center; }
  .chateau{ width:min(56vw,380px); }
  .quebec-ground{ position:absolute; bottom:0; left:0; right:0; height:12%; background:var(--accent3); border-top:5px solid var(--ink); }
  .quebec-flag{
    position:absolute; top:12%; left:50%; transform:translateX(-50%);
    width:96px;height:64px; background:#fff; border:4px solid var(--ink);
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  }
  .quebec-flag div{ background:var(--quebec-blue); position:relative; }
  .quebec-flag div::before{ content:"⚜"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:17px; }
  .quebec-cross-v, .quebec-cross-h{ position:absolute; background:#fff; z-index:2; }
  .quebec-cross-v{ top:0;bottom:0;left:calc(50% - 5px); width:10px; }
  .quebec-cross-h{ left:0;right:0;top:calc(50% - 5px); height:10px; }
  .quebec-text{
    position:absolute; bottom:24%; left:50%;
    transform:translateX(-50%) rotate(-2deg);
    font-size:clamp(20px,4vw,42px); font-weight:bold;
    background:var(--accent2); border:5px solid var(--ink); border-radius:12px;
    padding:4px 20px; box-shadow:6px 6px 0 var(--ink); z-index:8; white-space:nowrap;
  }

  /* ---------- SCENE 4: LAKE HOUSE ---------- */
  #scene-lake{ background:linear-gradient(180deg,#ffd9a0 0%,#ffb4a2 30%,#9fd3f0 55%,#9fd3f0 100%); }
  .mountains{
    position:absolute; bottom:34%; left:0; right:0; height:30%;
    background:#7a8fa6;
    clip-path:polygon(0% 100%, 10% 40%, 22% 70%, 35% 20%, 50% 60%, 65% 15%, 80% 55%, 92% 30%, 100% 100%);
    border-top:5px solid var(--ink);
  }
  .lake{
    position:absolute; bottom:0; left:0; right:0; height:34%;
    background:linear-gradient(180deg,var(--lake-blue) 0%,#2a7ba8 100%);
    border-top:5px solid var(--ink);
    overflow:hidden;
  }
  .lake::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 20px, transparent 20px 45px);
    animation:shimmer 5s linear infinite;
  }
  @keyframes shimmer{ from{ background-position-x:0; } to{ background-position-x:200px; } }

  .sun-set{
    position:absolute; top:8%; left:50%; transform:translateX(-50%);
    width:70px;height:70px; background:var(--accent2);
    border-radius:50%; border:5px solid var(--ink);
    box-shadow:0 0 0 10px rgba(255,210,63,0.3);
  }

  .house-wrap{
    position:absolute; bottom:32%; left:50%; transform:translateX(-50%);
    z-index:4;
  }
  .dock{
    position:absolute; bottom:20%; left:50%; transform:translateX(30px);
    width:150px; height:14px;
    background:#8a5a3a; border:4px solid var(--ink);
    z-index:3;
  }

  .car-wrap{
    position:absolute; bottom:31.5%; left:-260px;
    animation:carDrive 6.5s ease-in-out infinite;
    z-index:5;
  }
  @keyframes carDrive{
    0%{ left:-260px; }
    60%{ left:calc(50% - 130px); }
    62%{ left:calc(50% - 130px); }
    100%{ left:calc(50% - 130px); opacity:0; }
  }
  .road{
    position:absolute; bottom:31%; left:0; right:0; height:16px;
    background:repeating-linear-gradient(90deg,#555 0 18px, #333 18px 22px);
    border-top:4px solid var(--ink); border-bottom:4px solid var(--ink);
    z-index:2;
  }

  .lake-text{
    position:absolute; top:16%; left:50%;
    transform:translateX(-50%) rotate(-2deg);
    font-size:clamp(18px,3.6vw,36px); font-weight:bold;
    background:#fff; border:5px solid var(--ink); border-radius:12px;
    padding:4px 20px; box-shadow:6px 6px 0 var(--ink); z-index:8; white-space:nowrap;
    opacity:0; animation:lakeTextIn 6.5s ease-in-out infinite;
  }
  @keyframes lakeTextIn{
    0%,65%{ opacity:0; transform:translateX(-50%) rotate(-2deg) translateY(-10px); }
    78%{ opacity:1; transform:translateX(-50%) rotate(-2deg) translateY(0); }
    100%{ opacity:1; transform:translateX(-50%) rotate(-2deg) translateY(0); }
  }

  .family-lake{
    position:absolute; bottom:20%; left:65%;
    display:flex; align-items:flex-end; gap:4px; z-index:6;
    opacity:0;
    animation:familyIn 6.5s ease-in-out infinite;
  }
  @keyframes familyIn{
    0%,68%{ opacity:0; transform:translateY(10px); }
    82%{ opacity:1; transform:translateY(0); }
    100%{ opacity:1; transform:translateY(0); }
  }

  /* Family group reused (waving), scaled down for lake scene */
  .family{ position:absolute; bottom:12%; left:50%; transform:translateX(-50%); display:flex; align-items:flex-end; gap:6px; z-index:6; }
  .char{ position:relative; }
  .char .arm{ transform-origin:50% 10%; animation:wave 1.1s ease-in-out infinite; }
  .char.mom .arm{ animation-delay:0s; }
  .char.boy .arm{ animation-delay:0.15s; }
  .char.girl .arm{ animation-delay:0.3s; }
  @keyframes wave{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-30deg);}}
  .bob-char{ animation:bobChar 1.6s ease-in-out infinite; }
  @keyframes bobChar{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .caption-name{
    position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:bold; background:var(--paper);
    border:2px solid var(--ink); border-radius:6px; padding:1px 6px; white-space:nowrap;
  }

  @media (max-width:600px){
    .train-wrap svg{ width:340px; height:auto; }
    .airport-sign{ font-size:14px; padding:6px 14px; }
    .maple-big{ font-size:64px; }
    .plane{ width:160px; }
    .house-wrap svg{ width:220px; height:auto; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="panel-border"></div>
  <div class="title"><h1 id="scene-title">Ab in die Ferien! ✈️</h1></div>
  <div class="progress" id="progress-dots"></div>

  <!-- SCENE 1: TRAIN TO ZÜRICH AIRPORT -->
  <div class="scene active" id="scene-train">
    <div class="sun"></div>
    <div class="cloud cloud1 drift"></div>
    <div class="cloud cloud2 drift"></div>
    <div class="airport-sign">📍 Zürich Flughafen</div>
    <div class="hills"></div>
    <div class="track"></div>

    <div class="train-wrap">
      <svg width="500" height="180" viewBox="0 0 500 180">
        <rect x="20" y="60" width="140" height="70" rx="14" fill="#ff5b6a" stroke="#232323" stroke-width="5"/>
        <rect x="10" y="30" width="60" height="45" rx="8" fill="#ffd23f" stroke="#232323" stroke-width="5"/>
        <circle cx="45" cy="140" r="18" fill="#232323"/>
        <circle cx="120" cy="140" r="18" fill="#232323"/>
        <circle cx="45" cy="140" r="6" fill="#fff"/>
        <circle cx="120" cy="140" r="6" fill="#fff"/>
        <rect x="160" y="45" width="10" height="85" fill="#232323"/>

        <rect x="180" y="45" width="290" height="90" rx="16" fill="#4cd4a0" stroke="#232323" stroke-width="5"/>
        <rect x="200" y="60" width="70" height="55" rx="10" fill="#bfe9ff" stroke="#232323" stroke-width="4"/>
        <rect x="290" y="60" width="150" height="55" rx="10" fill="#bfe9ff" stroke="#232323" stroke-width="4"/>

        <g transform="translate(300,68)">
          <circle cx="16" cy="20" r="14" fill="#ffdcb2" stroke="#232323" stroke-width="3"/>
          <path d="M2 16 Q0 2 16 0 Q32 2 30 16 Q33 26 27 32 Q29 22 25 18 Q22 26 16 27 Q10 26 8 18 Q4 22 6 32 Q0 26 2 16Z" fill="#1a1a1a" stroke="#232323" stroke-width="2"/>
          <circle cx="11" cy="21" r="1.6" fill="#232323"/>
          <circle cx="21" cy="21" r="1.6" fill="#232323"/>
        </g>

        <g transform="translate(345,72)">
          <circle cx="14" cy="18" r="13" fill="#ffdcb2" stroke="#232323" stroke-width="3"/>
          <path d="M2 15 Q2 1 14 1 Q26 1 26 15 Q20 8 14 10 Q8 8 2 15Z" fill="#1a1a1a" stroke="#232323" stroke-width="2"/>
          <circle cx="10" cy="19" r="1.4" fill="#232323"/>
          <circle cx="18" cy="19" r="1.4" fill="#232323"/>
        </g>

        <g transform="translate(385,76)">
          <circle cx="12" cy="16" r="11" fill="#ffdcb2" stroke="#232323" stroke-width="3"/>
          <path d="M2 13 Q1 0 12 0 Q23 0 22 13 Q25 22 19 27 Q21 17 17 14 Q15 20 12 21 Q9 20 7 14 Q3 17 5 27 Q-1 22 2 13Z" fill="#1a1a1a" stroke="#232323" stroke-width="2"/>
          <circle cx="9" cy="17" r="1.3" fill="#232323"/>
          <circle cx="15" cy="17" r="1.3" fill="#232323"/>
        </g>

        <circle cx="230" cy="150" r="16" fill="#232323"/>
        <circle cx="290" cy="150" r="16" fill="#232323"/>
        <circle cx="350" cy="150" r="16" fill="#232323"/>
        <circle cx="410" cy="150" r="16" fill="#232323"/>
        <circle cx="230" cy="150" r="5" fill="#fff"/>
        <circle cx="290" cy="150" r="5" fill="#fff"/>
        <circle cx="350" cy="150" r="5" fill="#fff"/>
        <circle cx="410" cy="150" r="5" fill="#fff"/>
      </svg>
      <div class="smoke"></div>
      <div class="smoke"></div>
      <div class="smoke"></div>
    </div>
  </div>

  <!-- SCENE 2: PLANE TO CANADA -->
  <div class="scene" id="scene-plane">
    <div class="cloud cloud1 drift" style="top:8%;"></div>
    <div class="cloud cloud2 drift" style="top:20%;animation-delay:-14s;"></div>
    <div class="globe"></div>
    <div class="maple-big">🍁</div>
    <div class="canada-text">Willkommen in Kanada!</div>

    <div class="plane-wrap">
      <div class="plane">
        <div class="trail"></div>
        <div class="bubble">Auf nach Kanada! 🧳</div>
        <svg viewBox="0 0 220 90" width="220" height="90">
          <ellipse cx="110" cy="46" rx="95" ry="20" fill="#fff" stroke="#232323" stroke-width="5"/>
          <polygon points="0,46 40,30 40,62" fill="#4cd4a0" stroke="#232323" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="90,10 130,34 90,34" fill="#ff5b6a" stroke="#232323" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="90,82 130,58 90,58" fill="#ff5b6a" stroke="#232323" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="175" cy="46" r="12" fill="#ffd23f" stroke="#232323" stroke-width="5"/>
          <rect x="55" y="38" width="18" height="16" rx="4" fill="#7ec8f2" stroke="#232323" stroke-width="4"/>
          <rect x="80" y="38" width="18" height="16" rx="4" fill="#7ec8f2" stroke="#232323" stroke-width="4"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- SCENE 3: QUÉBEC -->
  <div class="scene" id="scene-quebec">
    <div class="quebec-flag">
      <div></div><div></div><div></div><div></div>
      <div class="quebec-cross-v"></div>
      <div class="quebec-cross-h"></div>
    </div>

    <div class="quebec-skyline">
      <svg class="chateau" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="90" width="340" height="120" fill="#c96a4b" stroke="#232323" stroke-width="5"/>
        <rect x="60" y="40" width="70" height="170" fill="#a6543a" stroke="#232323" stroke-width="5"/>
        <polygon points="60,40 95,5 130,40" fill="#5a3a2e" stroke="#232323" stroke-width="5"/>
        <rect x="250" y="20" width="60" height="190" fill="#a6543a" stroke="#232323" stroke-width="5"/>
        <polygon points="250,20 280,-10 310,20" fill="#5a3a2e" stroke="#232323" stroke-width="5"/>
        <rect x="170" y="65" width="55" height="145" fill="#b85f42" stroke="#232323" stroke-width="5"/>
        <polygon points="170,65 197,35 224,65" fill="#5a3a2e" stroke="#232323" stroke-width="5"/>
        <g fill="#bfe9ff" stroke="#232323" stroke-width="3">
          <rect x="75" y="70" width="16" height="20" rx="3"/>
          <rect x="100" y="70" width="16" height="20" rx="3"/>
          <rect x="75" y="100" width="16" height="20" rx="3"/>
          <rect x="100" y="100" width="16" height="20" rx="3"/>
          <rect x="185" y="90" width="16" height="20" rx="3"/>
          <rect x="205" y="90" width="16" height="20" rx="3"/>
          <rect x="265" y="55" width="16" height="20" rx="3"/>
          <rect x="285" y="55" width="16" height="20" rx="3"/>
          <rect x="150" y="120" width="18" height="24" rx="3"/>
          <rect x="180" y="120" width="18" height="24" rx="3"/>

<script>
  const scenes = [
    { el: document.getElementById('scene-train'),  title: 'Zug zum Flughafen! 🚆',      duration: 7000 },
    { el: document.getElementById('scene-plane'),  title: 'Auf nach Kanada! ✈️',        duration: 8000 },
    { el: document.getElementById('scene-quebec'), title: 'Angekommen in Québec! 🏰',    duration: 6000 },
    { el: document.getElementById('scene-lake'),   title: 'Ferienhaus am See! 🏡',       duration: 6500 }
  ];
  const titleEl = document.getElementById('scene-title');
  const dotsWrap = document.getElementById('progress-dots');

  scenes.forEach(() => {
    const dot = document.createElement('span');
    dotsWrap.appendChild(dot);
  });
  const dots = dotsWrap.querySelectorAll('span');

  let idx = 0;

  function showScene(i){
    scenes.forEach((s, si) => s.el.classList.toggle('active', si === i));
    dots.forEach((d, di) => d.classList.toggle('on', di === i));
    titleEl.style.opacity = '0';
    setTimeout(() => {
      titleEl.textContent = scenes[i].title;
      titleEl.style.opacity = '1';
    }, 300);
  }

  function loop(){
    showScene(idx);
    setTimeout(() => {
      idx = (idx + 1) % scenes.length;
      loop();
    }, scenes[idx].duration);
  }

  loop();
</script>
